<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tasting Wheel | Cask & Quill</title>
	<link rel="icon" type="image/png" href="/assets/images/favicon/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/images/favicon/favicon.svg" />
	<link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/assets/images/favicon/site.webmanifest" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,500;1,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/styles/styles.css">
</head>
<body>
	<header class="header">
		<nav class="nav">
			<a class="nav-logo" href="/">
				<img class="nav-logo-img" src="/assets/images/logo.png" alt="Cask & Quill Logo">
			</a>
			<div class="nav-buttons">
				<a id="regions-btn" class="button button-tertiary" href="/">Regions</a>
				<a id="lexicon-btn" class="button button-tertiary" href="/lexicon/">Lexicon</a>
				<a id="catalog-btn" class="button button-tertiary" href="/catalog/">Catalog</a>
				<a id="tasting-btn" class="button button-tertiary active" href="/tasting/">Tasting</a>
			</div>
			<div id="catalog-auth-root" class="catalog-auth-root"></div>
			<button id="nav-menu-btn" class="nav-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
				<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-list"></use></svg>
			</button>
		</nav>
	</header>

	<div id="nav-drawer-overlay" class="nav-drawer-overlay"></div>
	<nav id="nav-drawer" class="nav-drawer" aria-label="Site navigation" aria-hidden="true">
		<div class="nav-drawer-header">
			<button class="nav-drawer-close" type="button" aria-label="Close menu">
				<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
			</button>
		</div>
		<div class="nav-drawer-links">
			<a class="button button-tertiary" href="/">Regions</a>
			<a class="button button-tertiary" href="/lexicon/">Lexicon</a>
			<a class="button button-tertiary" href="/catalog/">Catalog</a>
			<a class="button button-tertiary active" href="/tasting/">Tasting</a>
		</div>
	</nav>

	<main class="main-content">
		<div class="tasting-container">
			<section class="hero grid">
				<div class="hero-heading grid-col-md-12 grid-col-lg-7">
					<h1 class="hero-title">Tasting Wheel</h1>
					<p>A sensory map of whisky — eleven families of aroma and flavour, each branching down into its sub-families and individual notes.</p>
				</div>
			</section>

			<section class="catalog-heading">
				<div class="catalog-controls-row">
					<div class="catalog-search-container">
						<input type="search" id="tasting-search" placeholder="Search flavours…" class="catalog-search-input" aria-label="Search flavours">
					</div>
					<div class="catalog-filter-controls">
						<select id="tasting-family" class="catalog-filter-select" aria-label="Filter by family"></select>
					</div>
				</div>
				<div class="catalog-controls-row">
					<p id="tasting-count" class="catalog-count text-heading-md"></p>
				</div>
			</section>

			<div id="tasting-wheel"></div>
		</div>
	</main>

	<script src="/assets/scripts/scripts.js" type="module"></script>
</body>
</html>
