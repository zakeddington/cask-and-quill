<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lexicon | Cask & Quill</title>
	<link rel="icon" type="image/png" href="/assets/images/favicon/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/images/favicon/favicon.svg" />
	<link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/assets/images/favicon/site.webmanifest" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/styles/styles.css">
</head>
<body>
	<header class="header">
		<nav class="nav">
			<a class="nav__logo" href="/">
				<img class="nav__logo-img" src="/assets/images/logo.png" alt="Cask & Quill Logo">
			</a>
			<div class="nav__buttons">
				<a id="regions-btn" class="button button--tertiary" href="/">Regions</a>
				<a id="lexicon-btn" class="button button--tertiary is-active" href="/lexicon/">Lexicon</a>
				<a id="catalog-btn" class="button button--tertiary" href="/catalog/">Catalog</a>
				<a id="flavors-btn" class="button button--tertiary" href="/flavors/">Flavors</a>
				<a id="stories-btn" class="button button--tertiary" href="/stories/">Stories</a>
			</div>
			<div id="auth-root" class="auth"></div>
			<button id="nav-menu-btn" class="nav__menu-btn button button--icon-only" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
				<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-list"></use></svg>
			</button>
		</nav>
	</header>

	<nav id="nav-drawer" class="drawer drawer-nav" aria-label="Site navigation" aria-hidden="true" inert>
		<div class="drawer__overlay"></div>
		<div class="drawer__panel">
			<div class="drawer__header">
				<button class="drawer__close button button--icon-only" type="button" aria-label="Close menu">
					<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
				</button>
			</div>
			<div class="drawer__body">
				<div class="drawer-nav__links">
					<a class="button button--tertiary drawer-nav__link" href="/">Regions</a>
					<a class="button button--tertiary drawer-nav__link is-active" href="/lexicon/">Lexicon</a>
					<a class="button button--tertiary drawer-nav__link" href="/catalog/">Catalog</a>
					<a class="button button--tertiary drawer-nav__link" href="/flavors/">Flavors</a>
					<a class="button button--tertiary drawer-nav__link" href="/stories/">Stories</a>
				</div>
			</div>
		</div>
	</nav>

	<main class="main-content">
		<div class="lexicon" id="lexicon-view">
			<aside class="lexicon-nav">
				<div class="lexicon-nav__list">
					<a href="#A" class="lexicon-nav__link">A</a>
					<a href="#B" class="lexicon-nav__link">B</a>
					<a href="#C" class="lexicon-nav__link">C</a>
					<a href="#D" class="lexicon-nav__link">D</a>
					<a href="#E" class="lexicon-nav__link">E</a>
					<a href="#F" class="lexicon-nav__link">F</a>
					<a href="#G" class="lexicon-nav__link">G</a>
					<a href="#H" class="lexicon-nav__link">H</a>
					<a href="#I" class="lexicon-nav__link">I</a>
					<a href="#J" class="lexicon-nav__link">J</a>
					<a href="#K" class="lexicon-nav__link">K</a>
					<a href="#L" class="lexicon-nav__link">L</a>
					<a href="#M" class="lexicon-nav__link">M</a>
					<a href="#N" class="lexicon-nav__link">N</a>
					<a href="#O" class="lexicon-nav__link">O</a>
					<a href="#P" class="lexicon-nav__link">P</a>
					<a href="#Q" class="lexicon-nav__link">Q</a>
					<a href="#R" class="lexicon-nav__link">R</a>
					<a href="#S" class="lexicon-nav__link">S</a>
					<a href="#T" class="lexicon-nav__link">T</a>
					<a href="#U" class="lexicon-nav__link">U</a>
					<a href="#V" class="lexicon-nav__link">V</a>
					<a href="#W" class="lexicon-nav__link">W</a>
					<a href="#X" class="lexicon-nav__link">X</a>
					<a href="#Y" class="lexicon-nav__link">Y</a>
					<a href="#Z" class="lexicon-nav__link">Z</a>
				</div>
			</aside>

			<div class="lexicon__main">
				<section class="hero grid">
					<div class="hero__heading grid__col--12-md grid__col--7-lg">
						<h1 class="hero__title">Lexicon</h1>
						<p>From mash bill to maturation, a reference for the language of whiskey — the terms, techniques, and traditions behind every pour.</p>
					</div>
					<div class="hero__image-col grid__col--12-md grid__col--5-lg">
						<img class="hero__image" src="/assets/images/hero-lexicon.jpg" alt="illustration of a quill, ink and book" />
					</div>
				</section>

				<section class="page-controls page-controls--sticky">
					<div class="page-controls__row">
						<div class="page-controls__search">
							<input type="search" id="search-input" placeholder="Find a term..." class="page-controls__search-input" aria-label="Find a term">
							<button id="search-clear" class="page-controls__search-clear button button--icon-only" type="button" aria-label="Clear search" hidden>
								<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
							</button>
						</div>
						<div class="page-controls__filters">
							<button id="lexicon-clear-all" class="page-controls__clear-all button button--tertiary" type="button" hidden>
								<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
								Clear all
							</button>
							<select id="category-select" class="page-controls__select" aria-label="Select category"></select>
						</div>
					</div>
				</section>

				<section id="lexicon-entries" class="lexicon__entries grid">
					<!-- Terms will be populated by JavaScript -->
				</section>
			</div>
		</div>
	</main>

	<script type="module" src="/assets/scripts/scripts.js"></script>
</body>
</html>
