<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lexicon | Cask & Quill</title>
	<link rel="icon" type="image/png" href="/assets/images/favicon/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/images/favicon/favicon.svg" />
	<link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/assets/images/favicon/site.webmanifest" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/styles/styles.css">
</head>
<body>
	<header class="header">
		<nav class="nav">
			<a class="nav-logo" href="/">
				<img class="nav-logo-img" src="/assets/images/logo.png" alt="Cask & Quill Logo">
			</a>
			<div class="nav-buttons">
				<a id="regions-btn" class="button button-tertiary" href="/">Regions</a>
				<a id="lexicon-btn" class="button button-tertiary active" href="/lexicon/">Lexicon</a>
				<a id="catalog-btn" class="button button-tertiary" href="/catalog/">Catalog</a>
				<a id="flavors-btn" class="button button-tertiary" href="/flavors/">Flavors</a>
			</div>
			<div id="auth-root" class="auth-root"></div>
			<button id="nav-menu-btn" class="nav-menu-btn button-icon-only" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
				<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-list"></use></svg>
			</button>
		</nav>
	</header>

	<nav id="nav-drawer" class="drawer drawer-nav" aria-label="Site navigation" aria-hidden="true">
		<div class="drawer-overlay"></div>
		<div class="drawer-panel">
			<div class="drawer-header drawer-nav-header">
				<button class="drawer-close button-icon-only" type="button" aria-label="Close menu">
					<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
				</button>
			</div>
			<div class="drawer-body">
				<div class="drawer-nav-links">
					<a class="button button-tertiary" href="/">Regions</a>
					<a class="button button-tertiary active" href="/lexicon/">Lexicon</a>
					<a class="button button-tertiary" href="/catalog/">Catalog</a>
					<a class="button button-tertiary" href="/flavors/">Flavors</a>
				</div>
			</div>
		</div>
	</nav>

	<main class="main-content">
		<div class="lexicon-container" id="lexicon-view">
			<aside class="lexicon-nav">
				<div class="lexicon-nav-list">
					<a href="#A" class="lexicon-nav-link">A</a>
					<a href="#B" class="lexicon-nav-link">B</a>
					<a href="#C" class="lexicon-nav-link">C</a>
					<a href="#D" class="lexicon-nav-link">D</a>
					<a href="#E" class="lexicon-nav-link">E</a>
					<a href="#F" class="lexicon-nav-link">F</a>
					<a href="#G" class="lexicon-nav-link">G</a>
					<a href="#H" class="lexicon-nav-link">H</a>
					<a href="#I" class="lexicon-nav-link">I</a>
					<a href="#J" class="lexicon-nav-link">J</a>
					<a href="#K" class="lexicon-nav-link">K</a>
					<a href="#L" class="lexicon-nav-link">L</a>
					<a href="#M" class="lexicon-nav-link">M</a>
					<a href="#N" class="lexicon-nav-link">N</a>
					<a href="#O" class="lexicon-nav-link">O</a>
					<a href="#P" class="lexicon-nav-link">P</a>
					<a href="#Q" class="lexicon-nav-link">Q</a>
					<a href="#R" class="lexicon-nav-link">R</a>
					<a href="#S" class="lexicon-nav-link">S</a>
					<a href="#T" class="lexicon-nav-link">T</a>
					<a href="#U" class="lexicon-nav-link">U</a>
					<a href="#V" class="lexicon-nav-link">V</a>
					<a href="#W" class="lexicon-nav-link">W</a>
					<a href="#X" class="lexicon-nav-link">X</a>
					<a href="#Y" class="lexicon-nav-link">Y</a>
					<a href="#Z" class="lexicon-nav-link">Z</a>
				</div>
			</aside>

			<div class="lexicon-main">
				<section class="hero grid">
					<div class="hero-heading grid-col-md-12 grid-col-lg-7">
						<h1 class="hero-title">Lexicon</h1>
						<p>From mash bill to maturation, a reference for the language of whiskey — the terms, techniques, and traditions behind every pour.</p>
					</div>
					<div class="hero-image-col grid-col-md-12 grid-col-lg-5">
						<img class="hero-image" src="/assets/images/hero-lexicon.jpg" alt="illustration of a quill, ink and book" />
					</div>
				</section>

				<section class="page-controls page-controls--sticky">
					<div class="controls-row">
						<div class="search-container">
							<input type="search" id="search-input" placeholder="Find a term..." class="search-input" aria-label="Find a term">
							<button id="search-clear" class="search-clear button-icon-only" type="button" aria-label="Clear search" hidden>
								<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
							</button>
						</div>
						<div class="filter-controls">
							<select id="category-select" class="filter-select" aria-label="Select category"></select>
						</div>
					</div>
				</section>

				<section id="lexicon-entries" class="lexicon-entries grid">
					<!-- Terms will be populated by JavaScript -->
				</section>
			</div>
		</div>
	</main>

	<script type="module" src="/assets/scripts/scripts.js"></script>
</body>
</html>
