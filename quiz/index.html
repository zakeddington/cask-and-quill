<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quiz | Cask & Quill</title>
	<link rel="icon" type="image/png" href="/assets/images/favicon/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/assets/images/favicon/favicon.svg" />
	<link rel="shortcut icon" href="/assets/images/favicon/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/assets/images/favicon/site.webmanifest" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/styles/styles.css">
</head>
<body class="stories-view">
	<header class="header">
		<nav class="nav">
			<a class="nav__logo" href="/">
				<img class="nav__logo-img" src="/assets/images/logo.png" alt="Cask & Quill Logo">
			</a>
			<div class="nav__buttons">
				<a id="regions-btn" class="button button--tertiary" href="/">Regions</a>
				<a id="lexicon-btn" class="button button--tertiary" href="/lexicon/">Lexicon</a>
				<a id="catalog-btn" class="button button--tertiary" href="/catalog/">Catalog</a>
				<a id="flavors-btn" class="button button--tertiary" href="/flavors/">Flavors</a>
				<a id="stories-btn" class="button button--tertiary" href="/stories/">Stories</a>
				<a id="quiz-btn" class="button button--tertiary is-active" href="/quiz/">Quiz</a>
			</div>
			<div id="auth-root" class="auth"></div>
			<button id="nav-menu-btn" class="nav__menu-btn button button--icon-only" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-drawer">
				<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-list"></use></svg>
			</button>
		</nav>
	</header>

	<nav id="nav-drawer" class="drawer drawer-nav" aria-label="Site navigation" aria-hidden="true" inert>
		<div class="drawer__overlay"></div>
		<div class="drawer__panel">
			<div class="drawer__header">
				<button class="drawer__close button button--icon-only" type="button" aria-label="Close menu">
					<svg class="svg-icon" aria-hidden="true" focusable="false"><use href="/assets/images/icon-sprite.svg#icon-x"></use></svg>
				</button>
			</div>
			<div class="drawer__body">
				<div class="drawer-nav__links">
					<a class="button button--tertiary drawer-nav__link" href="/">Regions</a>
					<a class="button button--tertiary drawer-nav__link" href="/lexicon/">Lexicon</a>
					<a class="button button--tertiary drawer-nav__link" href="/catalog/">Catalog</a>
					<a class="button button--tertiary drawer-nav__link" href="/flavors/">Flavors</a>
					<a class="button button--tertiary drawer-nav__link" href="/stories/">Stories</a>
					<a class="button button--tertiary drawer-nav__link is-active" href="/quiz/">Quiz</a>
				</div>
			</div>
		</div>
	</nav>

	<main class="main-content">
		<div class="quiz-view" id="quiz-view">
			<section class="quiz-view__hero hero grid">
				<div class="hero__heading grid__col--12-md grid__col--7-lg">
					<h1 class="hero__title">Quiz</h1>
					<p>Put your whiskey knowledge to the test — from the still and the cask to the label and the regions behind every bottle.</p>
				</div>
				<div class="hero__image-col grid__col--12-md grid__col--5-lg">
					<img class="hero__image" src="/assets/images/hero-whiskey.jpg" alt="illustration of barrels" />
				</div>
			</section>

			<div class="quiz-view__screen">
				<!-- Quiz screens will be populated by JavaScript -->
			</div>
		</div>
	</main>

	<script type="module" src="/assets/scripts/scripts.js"></script>
</body>
</html>
